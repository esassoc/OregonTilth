{{- if .Values.global.gateway.enabled -}}
# `issue-temporary-certificate: "true"` makes cert-manager write a self-signed
# cert into the Secret immediately, so AGC can program the listener (and open
# port 80 via the infra Gateway) without waiting on ACME. Once HTTP-01 succeeds,
# the real Let's Encrypt cert overwrites the temp one in the same Secret.
# Without this, AGC's listener-validation deadlocks the whole frontend.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.global.domains.web | replace "." "-" }}-tls
  annotations:
    cert-manager.io/issue-temporary-certificate: "true"
spec:
  secretName: {{ .Values.global.domains.web | replace "." "-" }}-tls
  issuerRef:
    name: letsencrypt-gandi
    kind: ClusterIssuer
  dnsNames:
  - {{ .Values.global.domains.web | quote }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.global.domains.api | replace "." "-" }}-tls
  annotations:
    cert-manager.io/issue-temporary-certificate: "true"
spec:
  secretName: {{ .Values.global.domains.api | replace "." "-" }}-tls
  issuerRef:
    name: letsencrypt-gandi
    kind: ClusterIssuer
  dnsNames:
  - {{ .Values.global.domains.api | quote }}
{{- end }}
