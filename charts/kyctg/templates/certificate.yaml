{{- if .Values.global.certificates.enabled -}}
# Vanity-domain TLS certs for the shared infra `agc-gateway`.
# The gateway-listener-operator watches for these Secrets and automatically:
#   1. Adds a Gateway listener for the vanity hostname
#   2. Creates a ReferenceGrant allowing cross-namespace Secret access
# Apps just need to deploy the Certificate + HTTPRoute — nothing else.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.global.domains.web | replace "." "-" }}-tls
spec:
  secretName: {{ .Values.global.domains.web | replace "." "-" }}-tls
  issuerRef:
    name: letsencrypt-gandi
    kind: ClusterIssuer
  dnsNames:
  - {{ .Values.global.domains.web | quote }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.global.domains.api | replace "." "-" }}-tls
spec:
  secretName: {{ .Values.global.domains.api | replace "." "-" }}-tls
  issuerRef:
    name: letsencrypt-gandi
    kind: ClusterIssuer
  dnsNames:
  - {{ .Values.global.domains.api | quote }}
{{- end }}
