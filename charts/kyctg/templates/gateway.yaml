{{- if .Values.global.gateway.enabled -}}
# Per-app Gateway. Attaches to the shared AGC frontend (BYO via `addresses`),
# so it costs nothing extra. Listener validity is independent of the infra
# Gateway, so a missing cert here cannot take down *.qa.esassoc.dev.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kyctg-gateway
  annotations:
    # AGC resource ID — required by the ALB controller on every Gateway, even
    # BYO-frontend ones. Pipeline sets this from the spoke's TF output.
    alb.networking.azure.io/alb-id: {{ required "global.gateway.albId is required (Application Gateway for Containers resource ID — set per-environment from TF output)" .Values.global.gateway.albId | quote }}
spec:
  gatewayClassName: azure-alb-external
  addresses:
  - type: alb.networking.azure.io/alb-frontend
    value: agc-frontend
  listeners:
  - name: https-web
    port: 443
    protocol: HTTPS
    hostname: {{ .Values.global.domains.web | quote }}
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: {{ .Values.global.domains.web | replace "." "-" }}-tls
  - name: https-api
    port: 443
    protocol: HTTPS
    hostname: {{ .Values.global.domains.api | quote }}
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: {{ .Values.global.domains.api | replace "." "-" }}-tls
{{- end }}
