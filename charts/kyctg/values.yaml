global:
  env:
    name: "qa"
    dbServer: "*.database.windows.net"
    databaseName: "OregonTilthDB"
    sqlUsername: "SqlAdministrator"
    aspNetEnvironment: "Staging"
    emailRedirect: ""
  domains:
    web: "kyctg.esa-qa.sitkatech.com"
    api: "kyctg-api.esa-qa.sitkatech.com"
  # Shared by the api and web charts: the api validates tokens against authority+audience, the web
  # app signs users in with domain+clientId and requests tokens for the same audience.
  # A single Auth0 tenant serves every environment, so these are not overridden per-env.
  auth0:
    domain: "knowyourcosttogrow.us.auth0.com"
    clientId: "NMcg7B6cTWgARMnzK6GLSULHtXXtjOvh"
    audience: "KnowYourCostToGrowAPI"
  secrets:
    apiSqlPassword: "passwordhere"
    sendGridApiKey: "sendgridapikeyhere"


kyctg-api:
  replicaCount: 1
  image:
    repository: containersesaqa.azurecr.io/oregontilth/api
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
  nameOverride: ""
  fullnameOverride: ""
  namespace: jackalope
  labels:
    app: oregontilth-api
  resources: 
    requests:
      memory: "512Mi"
    limits:
      memory: "1024Mi"
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
  podAnnotations: {}
  podSecurityContext: {}
    # fsGroup: 2000
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: "azure-application-gateway"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      acme.cert-manager.io/http01-edit-in-place: "true"
      appgw.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/issue-temporary-certificate: "true"
      appgw.ingress.kubernetes.io/connection-draining: "true"
      appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    tls: true
    path: /
    hosts:
      - "kyctg-api.esa-qa.sitkatech.com"
  # AGC: HTTPRoute on the in-cluster Envoy gateway. kyctg-web owns "/" on the same hostnames; Envoy takes the longest prefix.
  httproute:
    enabled: true
    gateway:
      name: apps-gateway
      namespace: default
    # hostnames[0] is set by the pipeline from domainWeb (both charts: the API rides the web
    # hostname). This entry is only a placeholder for helm lint, which runs without overrides.
    hostnames:
      - "qa.knowyourcosttogrow.com"
    pathPrefix: /api
    requestTimeout: 60s
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector: 
    agentpool: appnodepool
  tolerations: []
  affinity: {}
  

kyctg-web:
  replicaCount: 1
  image:
    repository: containersesaqa.azurecr.io/oregontilth/web
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
  nameOverride: ""
  fullnameOverride: ""
  namespace: jackalope
  labels:
    app: kyctg-web
  resources: 
    requests:
      memory: "256Mi"
    limits:
      memory: "512Mi"
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
  podAnnotations: {}
  podSecurityContext: {}
    # fsGroup: 2000
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: "azure-application-gateway"
    annotations:
      appgw.ingress.kubernetes.io/ssl-redirect: "true"
      appgw.ingress.kubernetes.io/connection-draining: "true"
      appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
      cert-manager.io/cluster-issuer: letsencrypt
      acme.cert-manager.io/http01-edit-in-place: "true"
      cert-manager.io/issue-temporary-certificate: "true"
  # AGC: HTTPRoute on the in-cluster Envoy gateway. kyctg-api takes /api on the same hostnames.
  httproute:
    enabled: true
    gateway:
      name: apps-gateway
      namespace: default
    # hostnames[0] is set by the pipeline from domainWeb (both charts: the API rides the web
    # hostname). This entry is only a placeholder for helm lint, which runs without overrides.
    hostnames:
      - "qa.knowyourcosttogrow.com"
    pathPrefix: /
    requestTimeout: 60s
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector: 
    agentpool: appnodepool
  tolerations: []
  affinity: {}
