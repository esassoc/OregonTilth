{{- if .Values.httproute.enabled -}}
{{- $fullName := include "kyctg-api.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "kyctg-api.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.httproute.gateway.name }}
    namespace: {{ .Values.httproute.gateway.namespace }}
  hostnames:
  - {{ .Values.global.domains.api | quote }}
  rules:
  - backendRefs:
    - name: {{ $fullName }}
      port: {{ $svcPort }}
{{- end }}
