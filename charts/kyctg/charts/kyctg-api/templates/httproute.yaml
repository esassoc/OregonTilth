{{- if .Values.httproute.enabled }}
{{- if not .Values.httproute.hostnames }}
{{- fail "kyctg-api.httproute.hostnames is set by the pipeline from domainWeb" }}
{{- end }}
# Attached to the in-cluster Envoy gateway (apps-gateway in `default`), never to the AGC front door.
# The API has no hostname of its own on AGC: it is served at /api on the web app's hostnames, so
# this route carries the web hostnames (and www on Production, like kyctg-web) and the longer prefix.
# No rewrite: the API strips /api itself (UsePathBase in Startup.cs).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kyctg-api.fullname" . }}
  labels:
    {{- include "kyctg-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    # Name only: the gateway has a single listener, so no port or sectionName.
    - name: {{ .Values.httproute.gateway.name }}
      namespace: {{ .Values.httproute.gateway.namespace }}
  hostnames:
    {{- range .Values.httproute.hostnames }}
    - {{ . | quote }}
    {{- if eq $.Values.global.env.aspNetEnvironment "Production" }}
    - {{ printf "www.%s" . | quote }}
    {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httproute.pathPrefix | quote }}
      backendRefs:
        - name: {{ include "kyctg-api.fullname" . }}
          port: {{ .Values.service.port }}
      timeouts:
        request: {{ .Values.httproute.requestTimeout | default "60s" }}
{{- end }}
