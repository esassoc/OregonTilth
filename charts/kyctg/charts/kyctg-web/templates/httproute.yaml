{{- if .Values.httproute.enabled -}}
{{- $fullName := include "kyctg-web.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
# HTTPS app route — auto-attaches to the HTTPS listener the
# gateway-listener-operator creates for this hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "kyctg-web.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.httproute.gateway.name }}
    namespace: {{ .Values.httproute.gateway.namespace }}
  hostnames:
  - {{ .Values.global.domains.web | quote }}
  rules:
  - backendRefs:
    - name: {{ $fullName }}
      port: {{ $svcPort }}
{{- if .Values.httproute.redirect }}
---
# HTTP→HTTPS redirect for this app's hostname only. Pins to the `http`
# listener so it's the sole non-cert-manager route for this hostname on
# port 80. cert-manager's HTTP-01 solver HTTPRoute uses a more-specific
# /.well-known/acme-challenge/<token> path and wins over this redirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-http-redirect
  labels:
    {{- include "kyctg-web.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.httproute.gateway.name }}
    namespace: {{ .Values.httproute.gateway.namespace }}
    sectionName: http
  hostnames:
  - {{ .Values.global.domains.web | quote }}
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- end }}
{{- end }}
