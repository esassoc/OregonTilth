{{- if .Values.httproute.enabled }}
{{- if not .Values.httproute.hostnames }}
{{- fail "kyctg-web.httproute.hostnames is set by the pipeline from domainWeb" }}
{{- end }}
# Attached to the in-cluster Envoy gateway (apps-gateway in `default`), never to the AGC front door.
# TLS terminates at AGC on the platform's per-hostname listeners (sitka-aks-terraform gateway.yaml),
# so this chart has no Certificate, Issuer or TLS Secret for it. kyctg-api routes /api on the same
# hostnames; Envoy prefers the longest matching prefix, so this route gets everything else.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kyctg-web.fullname" . }}
  labels:
    {{- include "kyctg-web.labels" . | nindent 4 }}
spec:
  parentRefs:
    # Name only: the gateway has a single listener, so no port or sectionName.
    - name: {{ .Values.httproute.gateway.name }}
      namespace: {{ .Values.httproute.gateway.namespace }}
  hostnames:
    {{- range .Values.httproute.hostnames }}
    - {{ . | quote }}
    {{- if eq $.Values.global.env.aspNetEnvironment "Production" }}
    - {{ printf "www.%s" . | quote }}
    {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httproute.pathPrefix | quote }}
      backendRefs:
        - name: {{ include "kyctg-web.fullname" . }}
          port: {{ .Values.service.port }}
      timeouts:
        request: {{ .Values.httproute.requestTimeout | default "60s" }}
{{- end }}
