services:
    oregontilth.api:
        image: oregontilth/api
        labels:
            - "com.microsoft.visualstudio.targetoperatingsystem=linux"
        build:
            args:
                source: ${DOCKER_BUILD_SOURCE}
        ports:
            # Compass reserved block for oregontilth: 11850-11899 (slot 0 = 11850-11859).
            # +0 = API http, +1 = API https. See esassoc/compass indexes/dev-ports.md.
            - "11850:8080"
            - "11851:8081"
