<div class="container-fluid">
  <div class="row mb-2 min-vh-100">
        <div class="col-lg-12">
        <app-alert-display></app-alert-display>
        <h1>Transplant Production Input Costs</h1>
        <custom-rich-text [customRichTextTypeID]="richTextTypeID"></custom-rich-text>
        <div class="card mt-4">
          <div class="card-header">
            Add new TP Input Cost
          </div>
          <div class="card-body">
            <form *ngIf=(model) (ngSubmit)="onSubmit(transplantProductionInputCostForm)" #transplantProductionInputCostForm="ngForm">
              <div class="row">
                
                <div class="mb-3 col-md-4">
                  <label class="required">TP Input</label>
                  <select name="TransplantProductionInputID" class="form-select" [(ngModel)]="model.TransplantProductionInputID" required>
                    <option value=""></option>
                    <option *ngFor="let category of transplantProductionInputs" [value]="category.TransplantProductionInputID">
                      {{category.TransplantProductionInputName}}
                    </option>
                  </select>
                </div>
                <div class="mb-3 col-md-4">
                  <label class="required">TP Tray Type</label>
                  <select name="TransplantProductionTrayTypeID" class="form-select" [(ngModel)]="model.TransplantProductionTrayTypeID" required>
                    <option value=""></option>
                    <option *ngFor="let category of transplantProductionTrayTypes" [value]="category.TransplantProductionTrayTypeID">
                      {{category.TransplantProductionTrayTypeName}}
                    </option>
                  </select>
                </div>
                <div class="mb-3 col-md-4">
                  <label class="required">Cost Per Tray</label>
                  <input class="form-control" type="number" name="CostPerTray" [(ngModel)]="model.CostPerTray" required>
                </div>
              </div>
              <div class="row">
                
                <div class="mb-3 col-md-12">
                  <label>Notes</label>
                  <input class="form-control" type="text" name="Notes" [(ngModel)]="model.Notes">
                </div>
              </div>
              <div class="row">
                <div class="col-sm">
                  <i class="fas fa-bolt"></i> Required field
                </div>
                <div class="col-sm text-end">
                  <button type="submit" class="btn btn-fresca" [disabled]="!transplantProductionInputCostForm.form.valid || isLoadingSubmit">
                    <span *ngIf="isLoadingSubmit" class="fa fa-spinner loading-spinner"></span>
                    Submit
                  </button>
                </div>
              </div>
            </form>
          </div>
          
        </div>

        <div class="row mt-2">
          <div class="col">
            <button class="btn btn-secondary btn-sm float-end" style="cursor: pointer;" (click)="exportToCsv()" placement="top" ngbTooltip="Download Grid">
              <i class="fas fa-download"></i>
              Download
            </button> 
          </div>
        </div>
        
        <div class="row mt-2">
          <div class="col">
            <ag-grid-angular theme="legacy" #transplantProductionInputCostsGrid style="width: 100%; height: 500px;" class="ag-theme-balham" [rowData]="transplantProductionInputCosts"
              [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="100" (cellValueChanged)="onCellValueChanged($event)" (gridReady)="onGridReady($event)" [getRowId]="getRowId" [suppressDragLeaveHidesColumns]="true">
            </ag-grid-angular>
          </div>
        </div>



    </div>
  </div>
  
</div>
